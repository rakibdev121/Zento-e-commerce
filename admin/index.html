<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Zento Admin Panel</title>
  <link rel="icon" type="image/png" href="zento-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="admin.css?v=20261010-1">
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen" hidden>
  <div class="login-card">
    <img class="logo" src="zento-logo-full.png" alt="Zento Online Store">
    <h1>Admin Login</h1>
    <p>Sign in to manage your store</p>
    <form id="adminLoginForm" novalidate>
      <label>Email
        <input id="adminEmail" type="email" placeholder="Admin email" autocomplete="username" required>
      </label>
      <label>Password
        <input id="adminPassword" type="password" placeholder="Password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary" type="submit">Login</button>
      <div id="loginError" class="login-error" role="alert"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div class="app" id="adminApp" hidden>
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="brand">
      <img src="zento-logo.png" alt="Zento Online Store logo">
      <div><b>Zento</b><small>Online Store</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-user">
      <div class="avatar" id="sideAvatar">A</div>
      <div><b id="sideName">Admin</b><small>Administrator</small></div>
      <button class="logout" id="logoutBtn" aria-label="Log out" title="Log out">
        <svg class="ico" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>
      </button>
    </div>
  </aside>
  <div class="scrim-nav" id="scrimNav"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="mobile-brand"><img src="zento-logo.png" alt="">Zento</div>
      <label class="search"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="gsearch" type="search" placeholder="Search products, press Enter..." aria-label="Search products"></label>
      <div class="tb-right">
        <button class="icon-btn" id="refreshBtn" aria-label="Refresh data" title="Refresh"><svg class="ico" viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg></button>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
        <button class="icon-btn" id="bellBtn" aria-label="Low stock alerts"><svg class="ico" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/></svg><i class="dot" id="bellDot" hidden></i></button>
        <div class="who"><div class="avatar" id="topAvatar">A</div><span id="topName">Admin</span></div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Quick navigation" hidden></nav>
<div id="layer"></div>

<script type="module" src="admin.js?v=20261010-1"></script>
</body>
</html>
